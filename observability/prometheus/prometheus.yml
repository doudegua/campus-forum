global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    env: prod

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  - job_name: campus-forum-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080
        labels:
          service: campus-forum-backend

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]