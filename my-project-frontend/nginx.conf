# ===========================================================================
# nginx.conf —— 前端容器里的 Web 服务器配置
#
# 它要同时干三件事，少一件页面就不好用：
#   1. 吐静态文件（Vue 编译出来的 index.html / js / css）
#   2. 把 /api 开头的请求转给后端容器
#   3. SPA 路由回退（刷新 /index/tieba 不能 404）
#
# 每一条都会说清"不做会怎样"，因为这些失败的共同点是：
# **页面能打开，但某个操作莫名其妙不行**，很容易查错方向。
# ===========================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 关掉 nginx 版本号。
    # 开着的话每个响应头里都有 "Server: nginx/1.27.x"，
    # 等于告诉扫描器"去查这个版本的已知漏洞"，没有任何好处。
    server_tokens off;

    # 请求体上限。默认只有 1M。
    # ⚠️ 不设大点的话，**头像和帖子配图稍微大一点就 413**，
    # 而 413 是 nginx 直接返回的纯 HTML，前端拿到的不是 JSON，
    # 表现为"上传失败但看不出原因"。后端自己限 900KB，这里给足余量。
    client_max_body_size 10m;

    # 压缩。JSON 和 HTML 压缩比很高，能省不少流量（主要在移动网络有感）。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # -----------------------------------------------------------------------
    # 1) 接口反代
    # -----------------------------------------------------------------------
    # 为什么在 nginx 这里转，而不是让前端直接请求后端地址：
    #   前端的 axios 用的是**相对路径**（/api/...），所以浏览器永远只跟
    #   当前这个域名打交道。好处有三个：
    #     ① 没有跨域，不需要 CORS
    #     ② 数据库里存的图片路径（/api/image/xxx）换域名也不用改数据
    #     ③ 后端地址只在这一处配置，前端构建产物和部署环境解耦
    location /api/ {
        # backend 是 docker-compose 里的服务名。compose 自带 DNS，
        # 容器之间用服务名互相访问，不用关心 IP（IP 每次重建都会变）。
        proxy_pass http://backend:8080;

        # 传给后端的协议信息。不传的话后端认为自己在跑 http，
        # 将来上了 HTTPS，后端生成的链接可能还是 http（混合内容警告）。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时。发验证码那条链要经过 RabbitMQ，比普通接口慢，
        # 给到 60s 免得偶发超时。
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # -----------------------------------------------------------------------
    # 2) 带 hash 的静态资源：永久缓存
    # -----------------------------------------------------------------------
    # Vite 编译出来的文件名带内容哈希（比如 index-BuQmjRr0.js）。
    # 内容一变文件名就变，所以这个文件名对应内容**永远不会变**，
    # 可以放心让浏览器缓存一年 —— 省掉的是每次访问的重复下载。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -----------------------------------------------------------------------
    # 3) SPA 路由回退
    # -----------------------------------------------------------------------
    # 前端的路由是 vue-router 的 history 模式：/index/tieba、/index/topic/85
    # 这些路径**服务端并不存在对应文件**。
    # 直接刷新或者把链接发给别人，nginx 会去磁盘找 /index/tieba 这个文件、
    # 找不到就 404 —— 明明页面是好的，刷新就坏了。
    #
    # try_files $uri $uri/ /index.html 的含义：
    #   先试这个路径有没有对应文件 → 再试当目录 → 都没有就交回 index.html，
    #   让前端路由自己按地址栏渲染正确的页面。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 本身**不能**被长缓存。
    # 它引用的是带 hash 的 js/css，每次构建后 index.html 里的文件名会变。
    # 如果浏览器缓存了旧 index.html，它会去找已经不存在的旧 js，白屏。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    # 不要暴露隐藏文件（.env、.git 之类不该出现在这里，多一层保险）
    location ~ /\. {
        deny all;
    }
}
